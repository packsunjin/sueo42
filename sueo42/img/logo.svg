<!-- 수어42 로고(11/19 사장 선택: Canva 시안 DAHbXaWacSE "두 사람 사이 42 말풍선"을 벡터로 옮김). 뜻: 수어를 앱에서 배워 농인·사회적 약자와 디지털로 소통하는 두 사람, 그 "사이"(42)의 대화.
     사람은 동그란 머리 + 둥근 몸만(손·팔 없음 — 손 모양은 실제 수어로 오해될 수 있음). 숫자는 Fredoka 700(OFL) 글자 모양. 색은 앱 초록·연두 -->
